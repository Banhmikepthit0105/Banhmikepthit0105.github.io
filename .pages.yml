# Pages CMS (https://app.pagescms.org): sign in with GitHub, open this repository,
# and edit Blog & Notes through a web editor. Each save is a commit to `main`,
# which rebuilds the site through .github/workflows/deploy-pages.yml.
media:
  input: public/assets/blog
  output: /assets/blog
content:
  - name: posts
    label: Blog & Notes
    type: collection
    path: content/posts
    filename: "{fields.key}.{fields.language}.md"
    view:
      fields: [title, key, language, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: select
        default: Blog
        options:
          values: [Blog, Notes]
      - name: key
        label: Post ID (same for every language version, e.g. life-at-22)
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: language
        label: Language
        type: select
        default: vi
        options:
          values:
            - { value: vi, label: Tiếng Việt }
            - { value: en, label: English }
            - { value: zh, label: 简体中文 }
      - name: excerpt
        label: Short summary
        type: text
      - name: cover
        label: Cover photo
        type: image
      - name: draft
        label: Draft (hidden on the site)
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text
